[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-attribution-clinic"
version = "0.1.0"
description = "Bad experiment clinic: inject and detect anti-patterns in quantitative research (teaching/diagnosis only)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "LaiQuan", email = "laiquan@example.com"}
]
keywords = ["quantitative-research", "backtesting", "anti-patterns", "teaching", "diagnosis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
clinic = "alpha_attribution_clinic.cli:main"

[project.urls]
Homepage = "https://github.com/LaiQuan-conquer/alpha-attribution-clinic"
Repository = "https://github.com/LaiQuan-conquer/alpha-attribution-clinic"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
